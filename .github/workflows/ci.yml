# Every push and pull request: type-check, the tests (the Postgres ones against a real Postgres), and a check that the
# committed dist/ is exactly what the source builds to (apps install this package from git, so dist/ is what they run).
name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: dist/ is up to date
        run: npm run build && git diff --exit-code -- dist

  # The backend on the previous driver major too (ADRs 0013, 0028: the engine owns the driver, pinned to 4 since 3.0.0).
  driver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        postgresjs: ['3']
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund --no-save postgres@${{ matrix.postgresjs }}
      - name: The driver installed
        run: grep -m1 '"version"' node_modules/postgres/package.json
      - run: npx tsc --noEmit -p tsconfig.v2.json
      - name: The engine's tests
        run: node --test test/contract.test.ts test/intents.test.ts test/records.test.ts test/schema.test.ts test/device.test.ts test/merge.test.ts
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  # A pull request labelled `automerge` merges itself once both jobs pass, at the commit they tested (as keel does).
  # Fixes and additions (patch and minor versions) get the label; a major version waits for the owner (CLAUDE.md).
  merge:
    needs: [test, driver]
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          now=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json state,headRefOid --jq '.state + " " + .headRefOid')
          case "$now" in
            "OPEN $HEAD_SHA")
              gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$HEAD_SHA"
              # Tag the release here: this merge doesn't start the tag workflow (CI's own token), and two releases
              # merged within its 15 minutes would leave the first untagged.
              merged=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq .mergeCommit.oid)
              v="v$(gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$merged" --jq .content | base64 -d | node -p "JSON.parse(require('fs').readFileSync(0)).version")"
              if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$v" >/dev/null 2>&1; then echo "$v is already tagged"
              else gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$v" -f sha="$merged" >/dev/null && echo "Tagged $v"; fi
              ;;
            "MERGED "*) echo "Already merged." ;;
            "OPEN "*) echo "The pull request has a newer commit; its own run merges it." ;;
            *) echo "Not merging: $now" ;;
          esac
